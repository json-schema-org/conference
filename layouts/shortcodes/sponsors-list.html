<div class="sponsors-section">

  {{ with site.Data.partner.platinum }}
    <hr class="sponsors-divider" />
    <h2 style="text-align: center; font-weight: bold; color: #73737a;">Platinum Sponsor 2026</h2>
    <div class="sponsors-grid">
      {{ range . }}
        <div class="sponsor-card">
          <a href="{{ .homepage_url }}" target="_blank" rel="noopener noreferrer" class="sponsor-link">
            <img class="sponsor-logo" style="max-height: 60px; max-width: 140px; width: auto; height: auto; object-fit: contain;" src="/images/partners/platinum/{{ .logo }}" alt="{{ .name }} Logo" />
          </a>
        </div>
      {{ end }}
    </div>
  {{ end }}

  {{ with site.Data.partner.past }}
    <hr class="sponsors-divider" />
    <h2 style="text-align: center; font-weight: bold; color: #73737a;">Past sponsors</h2>
    <div class="sponsors-grid">
      {{ range . }}
        <div class="sponsor-card">
          <a href="{{ .homepage_url }}" target="_blank" rel="noopener noreferrer" class="sponsor-link">
            <img class="sponsor-logo" style="max-height: 60px; max-width: 140px; width: auto; height: auto; object-fit: contain;" src="/images/{{ .logo_dir }}/{{ .logo }}" alt="{{ .name }} Logo" />
          </a>
        </div>
      {{ end }}
    </div>
  {{ end }}

</div>
