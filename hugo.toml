baseURL = "/"
relativeURLs = true
languageCode = "en-us"
title = "JSON Schema Conference 2026 - Paris"

# theme
theme = "devfest-theme-hugo"

# params
[params]
    title = "JSON Schema Conference 2026"
    year = 2026
    date = "2026-12-01"
    description = "Join us at CNIT Forest in Paris on December 1–3 for the 2026 JSON Schema Conference, part of the API Standards Conference."
    images = ["/images/"]
    email = "info@json-schema.org"
    keywords = "event, gdg, gde, devfest, google, programming, android, chrome, developers, web, cloud, androiddev"
    appleTouchIcon = "apple-touch-icon.png"
    ticketUrl = "https://portal.joinfost.io/event/future-of-software-technologies-paris-2026/5e27c773-7fa8-4169-b6a7-93494701212a/api-standards-conference?coupon=APISTANDARDSFREE144"
    favicon32 = "/favicon.ico"
    favicon16 = "/favicon.ico"
    safariPinnedTab = "/safari-pinned-tab.svg"
    themeColor = "#00040f"
    
[params.logos]
    jumbo = "images/logos/json-schema-logo-white.svg"
    header = "images/logos/json-schema-logo-white.svg"
    footer = "images/logos/json-schema-logo-white.svg"

[languages]
[languages.en]
    weight = 1
    languageName = "gb"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    anonymizeIP = false
    disable = true
    respectDoNotTrack = false
    useSessionStorage = false
  [privacy.instagram]
    disable = true
    simple = false
  [privacy.twitter]
    disable = false
    enableDNT = false
    simple = false
  [privacy.vimeo]
    disable = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = false
